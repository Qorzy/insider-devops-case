services:
  app:
    build:
      context: .
      args:
        BUILD_SHA: ${BUILD_SHA:-local-compose}
    image: insider-case:dev
    container_name: insider-case-local
    ports:
      - "8080:8080"
    environment:
      APP_NAME: insider-case
      LOG_LEVEL: INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s