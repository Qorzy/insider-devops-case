name: CI

# Workflow ne zaman koşar
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Concurrency: aynı PR'a yeni commit gelirse eski koşuyu iptal et (zaman + maliyet)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default permissions — her job kendi izinlerini ayrıca daraltabilir
permissions:
  contents: read

env:
  IMAGE_NAME: ${{ github.repository }}/insider-case
  REGISTRY: ghcr.io

jobs:
  # ============================================================
  # Job 1: Lint + test (Python tarafı)
  # ============================================================
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        run: pytest -v

  # ============================================================
  # Job 2: Helm chart lint (chart bozulmasın CI'da yakalansın)
  # ============================================================
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.16.2"

      - name: Helm lint
        run: helm lint helm/insider-case

      - name: Helm template render (dev)
        run: helm template ci helm/insider-case -f helm/insider-case/values-dev.yaml > /dev/null

      - name: Helm template render (prod)
        run: helm template ci helm/insider-case -f helm/insider-case/values-prod.yaml > /dev/null

  # ============================================================
  # Job 3: Build, scan, conditionally push
  # ============================================================
  build-scan-push:
    name: Build, Scan & Push
    needs: [lint-test, helm-lint]      # bu iki job'u bekle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                  # GHCR'a push için
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Sadece push edeceksek login ol — PR'da auth yapma (fork güvenliği)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image (load locally for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: insider-case:scan
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: insider-case:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"                # bulunursa CI kır
          ignore-unfixed: true          # patch'i olmayan CVE'leri sayma
          vuln-type: os,library

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max